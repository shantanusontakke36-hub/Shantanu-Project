apiVersion: apps/v1
kind: Deployment

metadata:
  name: shantanu-project-deployment

spec:
  replicas: 2

  selector:
    matchLabels:
      app: shantanu-project

  template:
    metadata:
      labels:
        app: shantanu-project

    spec:
      containers:
        - name: shantanu-project-container
          image: shantu123/shantanu-project-image:IMAGE_TAG

          ports:
            - containerPort: 8080
